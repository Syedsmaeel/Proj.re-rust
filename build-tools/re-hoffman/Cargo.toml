[package]
name = "re-hoffman"
version = "0.1.0"
edition = "2021"
authors = ["Syed Ismaeel <lucknow@est2019>"]
license = "AGPL-3.0"
description = "Hoffman Script 2.0 Engine — Pure Rust Sovereign OS-as-Code"

[dependencies]
re-core = { path = "../../core/re-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "hoffman"
path = "src/main.rs"
