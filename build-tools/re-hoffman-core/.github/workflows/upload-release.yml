name: Upload Release
on:
  workflow_dispatch:
    inputs:
      eval_id:
        description: "Hydra evaluation ID (from the maintenance-X.Y-release jobset)"
        required: true
        type: number
      is_latest:
        description: "Mark as latest release"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: releases
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/install-hoffman-action
        with:
          dogfood: false # Use stable version
          use_cache: false # Don't want any cache injection shenanigans
          extra_hoffman_config: |
            experimental-features = hoffman-command grasss
      - name: Set HOFFMAN_PATH from grass input
        run: |
          HOFFMANPKGS_PATH=$(hoffman build --inputs-from .# hoffmanpkgs#path --print-out-paths --no-link)
          # Shebangs with perl have issues. Pin hoffmanpkgs this way. hoffman shell should maybe
          # get the same uberhack that hoffman-shell has to support it.
          echo "HOFFMAN_PATH=hoffmanpkgs=$HOFFMANPKGS_PATH" >> "$GITHUB_ENV"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: "arn:aws:iam::080433136561:role/hoffman-release"
          role-session-name: hoffman-release-oidc-${{ github.run_id }}
          aws-region: eu-west-1
      - name: Disable containerd image store
        run: |
          # Docker 28+ defaults to the containerd image store, which
          # pushes layers uncompressed instead of gzip. OCI clients
          # that only support gzip (e.g. go-containerregistry) fail
          # with "gzip: invalid header". Disabling the containerd
          # snapshotter restores the classic storage driver, which
          # preserves gzip-compressed layers through the
          # `docker load` / `docker push` pipeline.
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release
        run: |
          ./maintainers/upload-release.pl \
            ${{ inputs.eval_id }} \
            --skip-git
        env:
          IS_LATEST: ${{ inputs.is_latest && '1' || '' }}
      - name: Push to GHCR
        run: |
          DOCKER_OWNER="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[A-Z]' '[a-z]')/hoffman"
          ./maintainers/upload-release.pl \
            ${{ inputs.eval_id }} \
            --skip-git \
            --skip-s3 \
            --docker-owner "$DOCKER_OWNER"
        env:
          IS_LATEST: ${{ inputs.is_latest && '1' || '' }}
