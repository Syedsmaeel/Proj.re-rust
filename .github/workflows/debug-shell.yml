name: Ephemeral Heavy Rust Terminal
on: 
  workflow_dispatch:
  push:

jobs:
  launch-shell:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Install Complete Rust Toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Hijack Terminal via Raw Binary
      run: |
        sudo apt-get update && sudo apt-get install -y tmate
        
        # Force generate an isolated local identity structure
        mkdir -p ~/.ssh
        ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        echo "=== INITIALIZING TERMINAL SECURE HANDSHAKE ==="
        
        # Run tmate with explicit socket and foreground parameters to ignore profile key locks
        tmate -S /tmp/tmate.sock -F new-session -d || true
        sleep 3
        
        echo "--------------------------------------------------------"
        echo "COPY THE INTERACTIVE LINK BELOW FOR YOUR DEV MACHINE:"
        tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
        echo "--------------------------------------------------------"
        
        # Direct hold loop: Force the system to stay alive for you
        while true; do
          if [ -S /tmp/tmate.sock ]; then
            sleep 10
          else
            echo "Session socket cleared. Exiting."
            break
          fi
        done

