name: Ephemeral Heavy Rust Terminal
on: 
  workflow_dispatch:
  push:

jobs:
  launch-shell:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Install Complete Rust Toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Hijack Terminal via Raw Binary
      run: |
        sudo apt-get update && sudo apt-get install -y tmate
        # Generate an ephemeral local SSH key pair so tmate doesn't throw exit code 2
        ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
        echo "=== LIVE TERMINAL CONFIGURATION ==="
        # Launch tmate in the background and dump the log hooks to the screen
        tmate -S /tmp/tmate.sock new-session -d
        tmate -S /tmp/tmate.sock wait-options
        echo "--------------------------------------------------------"
        echo "COPY ONE OF THE LINKS BELOW TO ACCESS YOUR DEV MACHINE:"
        tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
        tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
        echo "--------------------------------------------------------"
        # Keep the virtual machine alive indefinitely until you exit or hit the 6h mark
        while [ -S /tmp/tmate.sock ]; do sleep 5; done
