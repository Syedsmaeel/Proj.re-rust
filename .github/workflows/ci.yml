name: Sovereign CI

on:
  push:
    branches: [ main/root ]
  pull_request:
    branches: [ main/root ]

permissions:
  contents: write
  security-events: write
  actions: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi, x86_64-unknown-none
          
      - name: Build TBM (Bootloader)
        run: |
          cd kernel/tbm
          cargo build --target x86_64-unknown-uefi
          
      - name: Build Timux Kernel (x86_64)
        run: |
          cd kernel/timux
          cargo build --bin timux-x86_64 --target x86_64-unknown-none

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Cargo Audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
