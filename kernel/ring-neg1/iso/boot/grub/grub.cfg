# Ring -1 BIOS fallback — GRUB only used when UEFI unavailable
# On UEFI: BOOTX64.EFI runs directly, no GRUB

set default=0
set timeout=5
set timeout_style=hidden

menuentry "Timux (default)" {
    multiboot2 /boot/timux.elf ring0 loglevel=3
    boot
}
menuentry "Timux (recovery)" {
    multiboot2 /boot/timux.elf ring0 recovery=1 loglevel=5
    boot
}
menuentry "Timux (debug)" {
    multiboot2 /boot/timux.elf ring0 debug=1 loglevel=7 serial=1
    boot
}
menuentry "Bash++ shell only" {
    multiboot2 /boot/timux.elf ring2 bashpp=1 shell_only=1
    boot
}
