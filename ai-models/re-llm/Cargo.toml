[package]
name = "re-llm"
description = "Local LLM inference for Proj.re-rust — Phi-3 via candle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "re_llm"
path = "src/lib.rs"

[[bin]]
name = "re-llm"
path = "src/main.rs"

[dependencies]
re-core.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

# Local inference stack
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.21"
hf-hub = "0.4"
candle-quants = "0.9"
byteorder = "1.5"
