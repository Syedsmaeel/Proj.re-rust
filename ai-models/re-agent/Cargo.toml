[package]
name = "re-agent"
description = "Rust-native agentic runner — OpenClaw architecture translated to Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "re-agent"
path = "src/main.rs"

[lib]
name = "re_agent"
path = "src/lib.rs"

[dependencies]
re-core.workspace = true
re-llm = { path = "../re-llm", optional = true }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
toml.workspace = true
dirs = "5"
# Used by the web_fetch tool (sync). Stays light — rustls only.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[features]
# Off by default so `cargo build -p re-agent` stays fast and doesn't pull in
# the heavy candle / hf-hub stack. Enable to make `re-agent send --live` and
# `re-agent send --with-tools` actually call into Phi-3 via re-llm.
default = []
phi = ["dep:re-llm"]
