[package]
  name        = "oxidiser"
  description = "Sovereign OS scaffolding tool — generate a complete Re-Rust OS from a single script"
  version.workspace   = true
  edition.workspace   = true
  authors.workspace   = true
  license.workspace   = true
  repository.workspace = true

  [[bin]]
  name = "oxidiser"
  path = "src/main.rs"

  [dependencies]
  anyhow      = { workspace = true }
  clap        = { workspace = true }
  serde       = { workspace = true }
  serde_json  = { workspace = true }
  toml        = { workspace = true }
  dirs        = { workspace = true }
  