[package]
name = "qual-sea"
description = "Quantization & Weight Compression engine for Proj.re-rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
re-core.workspace = true
anyhow.workspace = true
clap.workspace = true
candle-core = "0.9"
candle-quants = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = { version = "2.4", features = ["serde"] }

[[bin]]
name = "qual-sea"
path = "src/main.rs"
