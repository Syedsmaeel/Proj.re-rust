[package]
name = "crabs-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
ai-agent-rs = { path = "../../packages/ai-agent-rs" }
db-adapter-rs = { path = "../../packages/db-adapter-rs" }
tower-http = { version = "0.6.8", features = ["fs"] }
bollard = "0.15"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
ron = "0.8"
grep = "0.3"
ignore = "0.4"
walkdir = "2.5"
oxc_parser = "0.42.0"
rustpython-parser = "0.3.1"
